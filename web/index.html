<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#182319">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest?v=__WEB_BUILD__">
    <link rel="icon" href="favicon.ico?v=__WEB_BUILD__" sizes="any">
    <link rel="apple-touch-icon" href="icon-192.png?v=__WEB_BUILD__">
    <link rel="stylesheet" href="style.css?v=__WEB_BUILD__">
    <link rel="stylesheet" href="loading-layout.css?v=__WEB_BUILD__">
    <title>Warzone — Линия Огня</title>
  </head>
  <body>
    <main id="welcome">
      <div class="welcome-backdrop" aria-hidden="true"></div>
      <section class="welcome-panel" aria-label="Запуск игры">
        <h1>Линия Огня</h1>
        <p class="intro">Восстановленная мобильная версия игры для IOS</p>
        <button type="button" id="start" class="game-button">Начать игру</button>
        <button type="button" id="restore" class="game-button secondary">
          Загрузить сохранение
        </button>
        <input id="save-file" type="file" accept="application/json,.json" hidden>
        <p class="autosave">Игра сохраняется автоматически на вашем устройстве.</p>
        <p id="status" role="status" aria-live="polite"></p>
        <button type="button" id="rescue-save" class="game-button secondary" hidden>
          Скачать сохранение
        </button>
        <p id="offline-status" role="status"></p>
        <button id="install" class="install-link" type="button" hidden>
          Установить на устройство
        </button>
        <nav class="community" aria-label="Сообщество проекта">
          <a
            class="community-button telegram"
            href="https://t.me/warzone_restoration"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M21.9 3.5 18.5 20c-.3 1.2-1 1.5-2 .9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3L18 5.9c.4-.4-.1-.6-.6-.3L5.3 13.2.2 11.6c-1.1-.3-1.1-1.1.2-1.6L20.4 2.3c.9-.3 1.7.2 1.5 1.2Z"
              />
            </svg>
            <span>Telegram</span>
          </a>
          <a
            class="community-button github"
            href="https://github.com/bakanovskii/warzone-app-client"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.543 0-.267-.01-.974-.015-1.912-3.13.68-3.79-1.51-3.79-1.51-.512-1.3-1.25-1.646-1.25-1.646-1.023-.7.078-.686.078-.686 1.132.08 1.727 1.162 1.727 1.162 1.006 1.724 2.64 1.226 3.283.937.103-.728.394-1.226.716-1.508-2.5-.284-5.13-1.25-5.13-5.565 0-1.23.44-2.235 1.16-3.023-.116-.285-.502-1.43.11-2.98 0 0 .944-.302 3.094 1.155a10.79 10.79 0 0 1 5.64 0c2.15-1.457 3.094-1.155 3.094-1.155.612 1.55.226 2.695.11 2.98.72.788 1.16 1.793 1.16 3.023 0 4.326-2.634 5.278-5.143 5.557.404.35.765 1.042.765 2.1 0 1.516-.014 2.74-.014 3.11 0 .302.203.65.774.54A11.25 11.25 0 0 0 12 .75Z"
              />
            </svg>
            <span>GitHub</span>
          </a>
        </nav>
      </section>
    </main>
    <div id="game-stage">
      <div id="stage-safe-area" aria-hidden="true"></div>
      <section id="loading" hidden aria-label="Загрузка клиента">
        <div class="loading-stage">
          <img class="loading-track" src="loading-track.png?v=__WEB_BUILD__" alt="">
          <progress id="progress" max="1" value="0" aria-label="Загрузка игры"></progress>
          <span id="percent">0%</span>
          <img class="loading-studio" src="loading-studio.png?v=__WEB_BUILD__" alt="Playkot">
          <p id="loading-status" role="status" aria-live="polite">Загружаем WASM-клиент…</p>
          <img class="loading-logo" src="loading-logo.png?v=__WEB_BUILD__" alt="Линия Огня">
        </div>
      </section>
      <canvas id="canvas" tabindex="0" hidden aria-label="Игровое поле"></canvas>
      <nav id="toolbar" hidden aria-label="Управление игрой">
        <button
          type="button"
          id="toolbar-handle"
          aria-label="Показать или скрыть панель; перетащить для перемещения"
          aria-expanded="true"
          aria-controls="toolbar-actions"
          title="Нажми, чтобы свернуть; потяни, чтобы переместить"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M9 5h6M9 12h6M9 19h6M4 5h.01M4 12h.01M4 19h.01M20 5h.01M20 12h.01M20 19h.01" />
          </svg>
        </button>
        <div id="toolbar-actions">
          <button type="button" id="zoom-out" aria-label="Отдалить карту">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
          </button>
          <button type="button" id="zoom-in" aria-label="Приблизить карту">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg>
          </button>
          <button type="button" id="fullscreen" aria-label="На весь экран" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5" />
            </svg>
          </button>
          <button type="button" id="export" aria-label="Скачать сохранение">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" />
            </svg>
          </button>
        </div>
      </nav>
    </div>
    <script src="audio.js?v=__WEB_BUILD__"></script>
    <script src="storage.js?v=__WEB_BUILD__"></script>
    <script src="app.js?v=__WEB_BUILD__"></script>
  </body>
</html>
